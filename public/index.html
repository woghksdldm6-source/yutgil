<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="윷놀이로 혼자 일곱 판 원정을 떠나거나, 친구들과 방을 만들어 함께 겨루는 웹 게임">
<title>윷길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Brush+Script&family=Song+Myung&display=swap">
<style>
/* Layout: a yut-nori table. The mat is the board; the other players sit above it, you sit below it, and the throwing tray, charms and room sit beside it. */
:root{
  --bg:#E6E9F0;
  --surface:#F7F8FB;
  --ink:#1A1E2E;
  --muted:#5A6177;
  --rule:#CBD0DC;
  --board:#E7DCC0;
  --weave:#DACCA6;
  --board-line:#6E5A35;
  --node:#F5EEDC;
  --node-ring:#6E5A35;
  --s0:#1F4FA8;
  --s1:#C2362B;
  --s2:#2B7A4B;
  --s3:#7446A8;
  --accent:#1F4FA8;
  --accent-ink:#FFFFFF;
  --seal:#B3362B;
  --seal-ink:#FFF6EC;
  --gold:#D9A21B;
  --gold-ink:#8C6100;
  --wood-flat:#EBCB91;
  --wood-edge:#B98F4E;
  --wood-mark:#9A6E33;
  --wood-round:#9A6431;
  --wood-round-dark:#6B4220;
  --f-title:"Song Myung","Gowun Batang",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-call:"Nanum Brush Script","Song Myung",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1120; --surface:#161A2D; --ink:#E8EAF2; --muted:#9CA3BC; --rule:#2C3253;
    --board:#1D2240; --weave:#232A4C; --board-line:#B8A574; --node:#232949; --node-ring:#C9B67F;
    --s0:#6C98F2; --s1:#EF6455; --s2:#4FBF80; --s3:#A783E0;
    --accent:#6C98F2; --accent-ink:#0B1530; --seal:#C9473A; --seal-ink:#FFF6EC;
    --gold:#F2C14E; --gold-ink:#F2C14E;
    --wood-flat:#D9B97F; --wood-edge:#9C7840; --wood-mark:#7E5A28; --wood-round:#7D5228; --wood-round-dark:#4F3218;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#161A2D; --ink:#E8EAF2; --muted:#9CA3BC; --rule:#2C3253;
  --board:#1D2240; --weave:#232A4C; --board-line:#B8A574; --node:#232949; --node-ring:#C9B67F;
  --s0:#6C98F2; --s1:#EF6455; --s2:#4FBF80; --s3:#A783E0;
  --accent:#6C98F2; --accent-ink:#0B1530; --seal:#C9473A; --seal-ink:#FFF6EC;
  --gold:#F2C14E; --gold-ink:#F2C14E;
  --wood-flat:#D9B97F; --wood-edge:#9C7840; --wood-mark:#7E5A28; --wood-round:#7D5228; --wood-round-dark:#4F3218;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 40px;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}

.top{max-width:900px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand h1{font-family:var(--f-title);font-weight:400;font-size:clamp(32px,7vw,42px);line-height:1;margin:0;letter-spacing:0.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.road{list-style:none;margin:0;padding:0;display:flex;align-items:flex-start}
.road li{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;width:52px}
.road li + li::before{content:"";position:absolute;top:7px;right:calc(50% + 9px);width:34px;height:2px;background:var(--rule)}
.road li.done + li::before,.road li.done::before{background:var(--accent)}
.road .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);box-sizing:border-box}
.road li.done .dot{background:var(--accent);border-color:var(--accent)}
.road li.now .dot{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 28%, transparent)}
.road .nm{font-size:11px;color:var(--muted);white-space:nowrap}
.road li.now .nm{color:var(--ink);font-weight:700}
@media (max-width:620px){.road li{width:34px}.road li + li::before{width:16px}.road .nm{display:none}}
.roombadge{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.roombadge b{font-family:var(--f-title);font-weight:400;font-size:22px;color:var(--ink);letter-spacing:0.12em}

.layout{max-width:900px;margin:0 auto;display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:16px 24px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.boardcol,.side{max-width:520px;width:100%;margin:0 auto}}
.boardcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}

.seats{display:flex;flex-direction:column;gap:6px}
.bar,.seatrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;min-width:0}
.seatrow.turn{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb, var(--gold) 30%, transparent)}
.seatrow .turnbadge{font-size:12px;font-weight:700;color:var(--gold-ink);white-space:nowrap}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.who-text{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.who-text b{font-family:var(--f-title);font-weight:400;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trait{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor}
.tok.s0{background:var(--s0);color:var(--s0)}
.tok.s1{background:var(--s1);color:var(--s1)}
.tok.s2{background:var(--s2);color:var(--s2)}
.tok.s3{background:var(--s3);color:var(--s3)}
.counts{display:flex;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.counts b{color:var(--ink);font-variant-numeric:tabular-nums}
.enter{display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
.enter:disabled{cursor:default;opacity:.6}
.enter.movable{border-color:var(--gold);animation:glow 1.2s ease-in-out infinite}
.enter.selected{border-color:var(--gold);background:color-mix(in srgb, var(--gold) 20%, var(--surface));animation:none}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--gold) 0%, transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 35%, transparent)}}

.boardwrap{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:1px solid var(--rule);
  background-color:var(--board);
  background-image:repeating-linear-gradient(45deg, var(--weave) 0 2px, transparent 2px 10px),repeating-linear-gradient(-45deg, var(--weave) 0 2px, transparent 2px 10px)}
#board{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#board .ln{stroke:var(--board-line);stroke-width:.9;fill:none;stroke-linecap:round}
#board .nd{fill:var(--node);stroke:var(--node-ring);stroke-width:.7}
#board .nd.big{stroke-width:1.1}
#board .lbl{font-size:2.7px;fill:var(--board-line);font-family:var(--f-body)}
#board .arrow{fill:var(--board-line)}
#board .trap path{stroke:var(--s1);stroke-width:1.1;stroke-linecap:round}
#board .trap circle{fill:color-mix(in srgb, var(--s1) 16%, transparent);stroke:var(--s1);stroke-width:.5;stroke-dasharray:1 .8}
#board .pv-path{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:2 1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
#board .pv-dest{fill:color-mix(in srgb, var(--gold) 22%, transparent);stroke:var(--gold);stroke-width:1.2;stroke-dasharray:2 1.4;cursor:pointer}
#board .pv-label{font-size:3.6px;fill:var(--gold-ink);font-family:var(--f-body);font-weight:700;paint-order:stroke;stroke:var(--board);stroke-width:1.2px}
#board .flash{fill:none;stroke:var(--s1);stroke-width:1.2}
.piece{transition:transform .14s ease-out}
.piece .hit{fill:transparent}
.piece .body{stroke:var(--surface);stroke-width:.9}
.piece.s0 .body{fill:var(--s0)}
.piece.s1 .body{fill:var(--s1)}
.piece.s2 .body{fill:var(--s2)}
.piece.s3 .body{fill:var(--s3)}
.piece .eye{fill:var(--surface);opacity:.55}
.piece .ring{fill:none;stroke:var(--gold);stroke-width:1.1;opacity:0}
.piece.movable{cursor:pointer}
.piece.movable .ring{opacity:1;animation:ringpulse 1.1s ease-in-out infinite}
.piece.selected .ring{opacity:1;stroke-width:1.6;animation:none}
.piece .cnt{font-size:3px;font-weight:700;fill:var(--ink);font-family:var(--f-body);paint-order:stroke;stroke:var(--board);stroke-width:1px}
@keyframes ringpulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}

.call{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-call);font-size:clamp(70px,20vw,120px);line-height:1;color:var(--ink);opacity:0;transform:scale(.85);transition:opacity .16s, transform .16s;text-shadow:0 0 14px var(--board),0 0 4px var(--board)}
.call.show{opacity:1;transform:scale(1)}
.call.hot{color:var(--gold-ink)}
.call.back{color:var(--s1)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);text-align:center;background:var(--ink);color:var(--surface);font-size:13px;padding:7px 13px;border-radius:14px;pointer-events:none;line-height:1.4}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.links{flex-direction:row;flex-wrap:wrap;gap:4px 18px;padding:10px 14px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.panel-head h2{font-family:var(--f-title);font-weight:400;font-size:20px;margin:0}
.score{font-size:13px;color:var(--muted)}
.score b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}

.tray{display:flex;align-items:center;justify-content:center;gap:12px;height:84px;border-radius:12px;background:var(--board);background-image:repeating-linear-gradient(45deg, var(--weave) 0 2px, transparent 2px 10px)}
.stick{width:15px;height:66px;border-radius:8px;position:relative;box-sizing:border-box}
.stick.flat{background:var(--wood-flat);box-shadow:inset 0 0 0 1px var(--wood-edge)}
.stick.flat::after{content:"";position:absolute;left:4px;right:4px;top:15px;bottom:15px;background:repeating-linear-gradient(180deg, var(--wood-mark) 0 2px, transparent 2px 8px);border-radius:2px;opacity:.75}
.stick.round{background:linear-gradient(90deg, var(--wood-round-dark), var(--wood-round) 45%, var(--wood-round-dark))}
.stick.marked.flat::before{content:"";position:absolute;left:50%;top:5px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--s1)}
.stick.tumble{animation:tumble .43s ease-in-out}
.stick:nth-child(2).tumble{animation-delay:.03s}
.stick:nth-child(3).tumble{animation-delay:.06s}
.stick:nth-child(4).tumble{animation-delay:.02s}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-20px) rotate(170deg)}100%{transform:translateY(0) rotate(360deg)}}
.status{margin:0;font-size:14px;min-height:1.55em}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;align-items:center}
.chips .none{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer;font-size:14px}
.chip b{font-family:var(--f-title);font-weight:400;font-size:19px}
.chip small{color:var(--muted);font-size:12px}
.chip.hot b{color:var(--gold-ink)}
.chip.back b{color:var(--s1)}
.chip.theirs{border-style:dashed}
.chip[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb, var(--gold) 20%, var(--surface))}
.chip:disabled{cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--f-title);font-size:18px;border-radius:999px;padding:11px 18px;border:1.5px solid transparent;cursor:pointer;line-height:1.1;color:var(--ink);background:transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btnrow .btn.primary{flex:1 1 160px}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--bg)}
.btn.small{font-size:15px;padding:8px 14px}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.warn{border-color:var(--s1);color:var(--s1)}
.btn:focus-visible,.chip:focus-visible,.enter:focus-visible,.offer:focus-visible,.seg button:focus-visible,.linkbtn:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb, var(--gold) 60%, transparent);outline-offset:2px}

.charms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.charms li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start}
.seal{grid-row:span 2;width:30px;height:30px;border-radius:6px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--f-title);font-size:15px}
.seal.s0{background:var(--s0)}.seal.s1{background:var(--s1)}.seal.s2{background:var(--s2)}.seal.s3{background:var(--s3)}
.charms b{font-weight:700;font-size:14px}
.charms span.d{font-size:12.5px;color:var(--muted);line-height:1.45}
.charms .empty{display:block;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start}
.panel.links{align-items:center}
.toggle{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:4px 0;color:var(--ink);font-size:13px;cursor:pointer}
.toggle .sw{width:28px;height:16px;border-radius:99px;background:var(--rule);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.toggle:focus-visible{outline:3px solid color-mix(in srgb, var(--gold) 60%, transparent);outline-offset:2px;border-radius:6px}
.share{display:flex;gap:8px;min-width:0}
.netline{margin:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.netdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--rule)}
.netdot.ok{background:var(--s2)}
.netdot.part{background:var(--gold)}
.netdot.slow{background:var(--s1)}

.modal{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;overflow:auto;
  padding-top:max(16px, env(safe-area-inset-top, 0px));padding-bottom:max(16px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:color-mix(in srgb, var(--bg) 72%, transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px -18px color-mix(in srgb, var(--ink) 45%, transparent)}
.sheet h2{font-family:var(--f-title);font-weight:400;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.sheet p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.lead{font-size:14.5px}
.fine{font-size:12.5px;color:var(--muted)}
.err{font-size:13.5px;color:var(--s1);font-weight:700}
.err:empty{display:none}
.offers{display:grid;gap:8px}
.offer{text-align:left;color:var(--ink);background:var(--bg);border:1.5px solid var(--rule);border-radius:12px;padding:11px 14px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:start;font-size:inherit}
.offer:hover{border-color:var(--gold)}
.tiertag{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;vertical-align:2px;background:var(--rule);color:var(--muted)}
.offer.tier-2{border-color:color-mix(in srgb, var(--s0) 55%, var(--rule))}
.offer.tier-2 .tiertag{background:color-mix(in srgb, var(--s0) 18%, transparent);color:var(--s0)}
.offer.tier-3{border-color:var(--gold);background:color-mix(in srgb, var(--gold) 10%, var(--bg))}
.offer.tier-3 .tiertag{background:var(--gold);color:var(--surface)}
.offer.tier-catchup{border-color:color-mix(in srgb, var(--s1) 55%, var(--rule))}
.offer.tier-catchup .tiertag{background:color-mix(in srgb, var(--s1) 18%, transparent);color:var(--s1)}
.offer b{font-size:15.5px}
.offer .d{font-size:13px;color:var(--muted);line-height:1.45}
.big{font-family:var(--f-title);font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);margin-left:4px}
.actions{display:flex;flex-direction:column;gap:8px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules b{font-family:var(--f-title);font-weight:400;font-size:16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
input.code{text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-title)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--rule)}
.roomcode{font-family:var(--f-title);font-size:40px;letter-spacing:.18em;line-height:1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:10px;font-size:15px}
.plist .tag{font-size:12px;color:var(--muted)}
.plist .ok{margin-left:auto;font-size:12.5px;color:var(--muted)}
.plist .ok.done{color:var(--s2);font-weight:700}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.seg{display:flex;background:var(--bg);border-radius:99px;padding:3px;gap:2px}
.seg button{font-size:13.5px;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px color-mix(in srgb, var(--ink) 18%, transparent)}
.seg button:disabled{cursor:default}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>윷길</h1>
    <p id="tagline">윷놀이 일곱 판, 부적을 모으며 끝까지</p>
  </div>
  <div class="topright">
    <ol class="road" id="road" aria-label="판 진행"></ol>
    <div class="roombadge" id="roomBadge" hidden>방 <b id="roomBadgeCode"></b></div>
  </div>
</header>

<main class="layout">
  <section class="boardcol" aria-label="윷판">
    <div class="seats" id="seats"></div>

};
// 부적 세기 조절값 (확률형 부적의 발동 확률 등)
const TUNE = { geolMode:'extra', geolP:0.25, chainP:0.4, doubleP:0.5, comeback:1, sprint:2, sprintLate:1, noBackTo:'걸' };
// 등급별 가중치: 일반 3, 희귀 2, 전설 1 (후보 3개를 이 비율로 뽑아요)
const TIER_W = { 1:3, 2:2, 3:1 };
const TIER_NAME = { 1:'일반', 2:'희귀', 3:'전설' };
function weightedPick(pool, n, rnd){
  const a = pool.slice(), out = [];
  while (out.length < n && a.length){
    let tot = 0; for (const id of a) tot += TIER_W[(UPG[id] && UPG[id].tier) || 1];
    let r = rnd()*tot, k = 0;
    for (; k < a.length - 1; k++){ r -= TIER_W[(UPG[a[k]] && UPG[a[k]].tier) || 1]; if (r < 0) break; }
    out.push(a.splice(k, 1)[0]);
  }
  return out;
}
const MULTI_POOL = ['reroll','shortcut','piggy','chain','moCharm','yutCharm','noBack','quickDo','geol','sprint','hex'];
const CATCHUP_POOL = ['comeback','express','payback','double'];
const STAGES = [
  { name:'동네 꼬마',   trait:'아직 윷놀이가 서툴러요.',                      up:{},                                         noise:30, capW:1.0 },
  { name:'마을 장정',   trait:'잡을 수 있으면 무조건 잡으러 와요.',            up:{},                                         noise:14, capW:2.0 },
  { name:'장터 노름꾼', trait:'윷과 모가 유난히 잘 나와요.',                   up:{ yutCharm:1, moCharm:1 },                  noise:11, capW:1.2 },
  { name:'서당 훈장',   trait:'수를 잘 읽고, 걸이 나오면 한 번 더 던져요.',     up:{ geol:1 },                                 noise:5,  capW:1.2 },
  { name:'도깨비',      trait:'지름길을 꿰고 있고, 말 하나가 앞서 출발해요.',   up:{ shortcut:1, head:1 },                     noise:6,  capW:1.3 },
  { name:'사또',        trait:'판마다 2번 다시 던지고, 잡으면 가끔 한 번 더 던져요.',  up:{ reroll:1, chain:1 },                      noise:4,  capW:1.4 },
  { name:'산신령',      trait:'지름길, 다시 던지기, 윷·모 부적을 모두 가졌어요.', up:{ shortcut:1, reroll:1, yutCharm:1, moCharm:1 }, noise:2, capW:1.4 }
];

function routeFrom(n){
  if (n === WAIT) return OUTER;
  if (n === 5) return FROM5;
  if (n === 10) return FROM10;
  if (n === 22) return FROM22;
  let i;
  if ((i = OUTER.indexOf(n)) >= 0) return OUTER.slice(i + 1);
  if ((i = FROM5.indexOf(n)) >= 0) return FROM5.slice(i + 1);
  if ((i = FROM10.indexOf(n)) >= 0) return FROM10.slice(i + 1);
  return [0];
}
function walk(n, steps, master){
  let route = routeFrom(n), i = 0; const vis = [];
  for (let s = 0; s < steps; s++){
    const nx = route[i++];
    if (nx === 0 || nx === undefined){ vis.push(0); return { end:HOME, vis }; }
    vis.push(nx);
    if (master && s < steps - 1 && BRANCH.has(nx)){ route = routeFrom(nx); i = 0; }
  }
  return { end:vis[vis.length - 1], vis };
}
function dist(n){ if (n === HOME) return 0; if (n === WAIT) return 21; const r = routeFrom(n); const i = r.indexOf(0); return i < 0 ? 21 : i + 1; }

let G = null;              // 지금 판의 상태 (친구와 하기에서는 이 객체가 그대로 서버에 저장돼요)
let CH = () => ({});       // 자리별 부적 목록을 돌려주는 함수
function __setCtx(g, ch){ G = g; CH = ch; }
const cnt = (seat, id) => (CH(seat)[id] || 0);
const hasC = (seat, id) => cnt(seat, id) > 0;
const pcs = seat => G.pieces.filter(p => p.seat === seat);
const atN = (seat, node) => G.pieces.filter(p => p.seat === seat && p.node === node);
const othersAt = (seat, node) => G.pieces.filter(p => p.seat !== seat && p.node === node);
const waitingOf = seat => atN(seat, WAIT);
function seatsExcept(seat){ const a = []; for (let s = 0; s < G.n; s++) if (s !== seat) a.push(s); return a; }

function newGame(n, k){
  const pieces = [];
  for (let s = 0; s < n; s++) for (let i = 0; i < k; i++) pieces.push({ id:'s' + s + 'p' + i, seat:s, node:WAIT, trail:[] });
  return { gid:String(Date.now()) + Math.floor(Math.random()*1e6), n, nPieces:k, pieces, turn:0, throwsLeft:1, chips:[], chipSeq:0,
    rerollUsed:Array(n).fill(0), traps:[], trapOwner:-1, seq:0, events:[], winner:null,
    charms:Array.from({ length:n }, () => ({})), augmentsOn:false, augRound:0, augment:null, bonus:Array(n).fill(0) };
}
function weights(seat){
  const w = { '빽도':1, '도':3, '개':6, '걸':4, '윷':1, '모':1 };
  w['모'] += cnt(seat, 'moCharm') + TUNE.comeback*cnt(seat, 'comeback'); w['윷'] += cnt(seat, 'yutCharm') + TUNE.comeback*cnt(seat, 'comeback');
  if (hasC(seat, 'noBack')){ w[TUNE.noBackTo] += w['빽도']; w['빽도'] = 0; }
  if (seatsExcept(seat).some(s => hasC(s, 'hex'))){ w['윷'] *= 0.5; w['모'] *= 0.5; }
  return KEYS.map(k => [k, w[k]]);
}
function rollKey(seat, rnd){
  const w = weights(seat); let tot = 0; w.forEach(x => tot += x[1]);
  let r = rnd()*tot;
  for (const [k, v] of w){ r -= v; if (r < 0) return k; }
  return '개';
}
function simulate(seat, key, from, alt){
  let group;
  if (from === WAIT){ const w = waitingOf(seat); if (!w.length || key === '빽도') return null; group = [w[0]]; }
  else { group = atN(seat, from); if (!group.length) return null; }
  if (key === '빽도'){
    if (from === 1) return { group, end:HOME, vis:[0], back:true };   // 도 자리에서 빽도면 참먹이로 돌아가 골인
    const t = group[0].trail;
    if (t.length >= 2) return { group, end:t[t.length - 2], vis:[t[t.length - 2]], back:true };
    return { group, end:WAIT, vis:[], back:true };
  }
  let st = STEP[key];
  if (key === '도' && alt && hasC(seat, 'quickDo')) st = 2;
  if (key === '걸' && hasC(seat, 'geol') && TUNE.geolMode === 'four') st = 4;
  if (group.length >= 2 && hasC(seat, 'piggy')) st += 1;
  if (from !== WAIT && LAST.has(from) && hasC(seat, 'sprint')) st += TUNE.sprint;
  if (TUNE.sprintLate && hasC(seat, 'sprint') && pcs(seat).filter(p => p.node !== HOME).length === 1) st += TUNE.sprintLate;
  if (hasC(seat, 'express')) st += 1;

  return { group, end:r.end, vis:r.vis, back:false };
}
function legalFroms(seat, key){
  const out = [], seen = new Set();
  for (const p of pcs(seat)){
    if (p.node === HOME || p.node === WAIT || seen.has(p.node)) continue;
    seen.add(p.node); out.push(p.node);
  }
  if (key !== '빽도' && waitingOf(seat).length) out.push(WAIT);
  return out;
}
function pushEv(ev){
  ev.seq = ++G.seq; G.events.push(ev);
  if (G.events.length > 40) G.events.splice(0, G.events.length - 40);
  G.rev = G.seq + '-' + Math.random().toString(36).slice(2, 8);   // 같은 순번이라도 내용이 다르면 알아챌 수 있게
  return ev;
}
function actThrow(seat, isReroll, rnd){
  const key = rollKey(seat, rnd || Math.random);
  G.throwsLeft--;

  const r = rnd || Math.random;
  if (key === '윷' || key === '모') extra = (hasC(seat, 'double') && r() < TUNE.doubleP) ? 2 : 1;
  else if (key === '걸' && hasC(seat, 'geol') && TUNE.geolMode === 'extra' && r() < TUNE.geolP) extra = 1;
  G.throwsLeft += extra;
  G.chips.push({ key, id:++G.chipSeq });
  return pushEv({ t:'throw', seat, key, extra, reroll:!!isReroll });
}
function rerollsLeft(seat){ return 2*cnt(seat, 'reroll') - (G.rerollUsed[seat] || 0); }
function actReroll(seat, ci, rnd){
  if (rerollsLeft(seat) <= 0 || !G.chips[ci]) return null;
  G.rerollUsed[seat] = (G.rerollUsed[seat] || 0) + 1;
  G.chips.splice(ci, 1); G.throwsLeft++;
  return actThrow(seat, true, rnd);
}
function actMove(seat, ci, from, alt){
  const chip = G.chips[ci]; if (!chip) return null;
  alt = !!(alt && chip.key === '도' && hasC(seat, 'quickDo'));
  const sim = simulate(seat, chip.key, from, alt); if (!sim) return null;
  G.chips.splice(ci, 1);
  const group = sim.group;
  const ev = { t:'move', seat, key:chip.key, alt, from, ids:group.map(p => p.id), vis:sim.vis.slice(), end:sim.end, victims:[], trapped:false, home:0 };
  if (sim.end === HOME){ group.forEach(p => { p.node = HOME; p.trail = []; }); ev.home = group.length; }
  else if (sim.end === WAIT){ group.forEach(p => { p.node = WAIT; p.trail = []; }); }
  else {
    const trail = sim.back ? group[0].trail.slice(0, -1) : (from === WAIT ? [] : group[0].trail).concat(sim.vis.filter(n => n !== 0));
    group.forEach(p => { p.node = sim.end; });
    const victims = othersAt(seat, sim.end);
    victims.forEach(p => { p.node = WAIT; p.trail = []; });
    ev.victims = victims.map(p => p.id);
    for (const vs of new Set(victims.map(p => p.seat))){
      const c = cnt(vs, 'payback');
      if (c){ if (!G.bonus) G.bonus = Array(G.n).fill(0); G.bonus[vs] = (G.bonus[vs] || 0) + c; }
    }
    atN(seat, sim.end).forEach(p => { p.trail = trail.slice(); });
    const ti = G.traps.indexOf(sim.end);
    if (ti >= 0 && seat !== G.trapOwner){
      G.traps.splice(ti, 1);
      atN(seat, sim.end).forEach(p => { p.node = WAIT; p.trail = []; });
      ev.trapped = true;
    }
    if (victims.length){
      const chainHit = hasC(seat, 'chain') && Math.random() < TUNE.chainP;   // 잡기 연쇄: 확률로 한 번 더
      ev.chain = chainHit;
      G.throwsLeft += chainHit ? 2 : 1;
    }
  }
  if (pcs(seat).every(p => p.node === HOME)) G.winner = seat;
  return pushEv(ev);
}
// 던지기나 이동이 끝난 뒤 차례를 정리해요. 쓸 수 없는 결과는 버리고, 할 일이 없으면 다음 사람에게 넘겨요.
function settle(seat, rnd){
  if (G.winner !== null) return 'over';
  if (G.throwsLeft > 0) return 'throw';
  const removed = [];
  G.chips = G.chips.filter(c => { const ok = legalFroms(seat, c.key).length > 0; if (!ok) removed.push(c.key); return ok; });
  if (removed.length) pushEv({ t:'skip', seat, keys:removed });
  if (G.chips.length) return 'move';
  G.turn = (seat + 1) % G.n;
  const bonus = (G.bonus && G.bonus[G.turn]) || 0;
  if (G.bonus) G.bonus[G.turn] = 0;
  G.throwsLeft = 1 + bonus; G.chips = [];
  pushEv({ t:'turn', seat:G.turn, bonus });
  const round = augmentDue();
  if (round){
    G.augRound = round;
    G.augment = makeAugment(round, rnd || Math.random);
    pushEv({ t:'augment', round, under:G.augment.under.slice() });
    return 'augment';
  }
  return 'turn';
}
function phaseOf(){ if (!G) return 'none'; if (G.winner !== null) return 'over'; if (G.augment) return 'augment'; return G.throwsLeft > 0 ? 'throw' : 'move'; }

// ---------- 증강 라운드 (친구와 하기) ----------
// 누군가 첫 골인을 했을 때, 그리고 누군가 골인을 하나 남겼을 때 모두 부적을 하나씩 더 골라요.
function augThresholds(k){ return k - 1 > 1 ? [1, k - 1] : [1]; }
function augmentDue(){
  if (!G.augmentsOn) return 0;
  let maxHome = 0;
  for (let s = 0; s < G.n; s++) maxHome = Math.max(maxHome, pcs(s).filter(p => p.node === HOME).length);
  let r = 0;
  augThresholds(G.nPieces).forEach((t, i) => { if (maxHome >= t) r = i + 1; });

  callEl.className = 'call show' + ((key === '윷' || key === '모') ? ' hot' : key === '빽도' ? ' back' : '');
  clearTimeout(callTimer); callTimer = setTimeout(() => { callEl.className = 'call'; }, 850);
}
async function animThrow(key, fast){
  Sound.play('throw');
  sticks.forEach(s => { s.classList.remove('tumble'); void s.offsetWidth; s.classList.add('tumble'); });
  await sleep(reduceMotion ? 60 : fast ? 260 : 440);
  const n = { '빽도':1, '도':1, '개':2, '걸':3, '윷':4, '모':0 }[key];
  let flat;
  if (key === '빽도') flat = [0];
  else if (key === '도') flat = [1 + Math.floor(Math.random()*3)];
  else { const idx = [0,1,2,3]; for (let i = 3; i > 0; i--){ const j = Math.floor(Math.random()*(i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } flat = idx.slice(0, n); }
  sticks.forEach((s, i) => { s.classList.remove('tumble'); s.classList.toggle('flat', flat.includes(i)); s.classList.toggle('round', !flat.includes(i)); });
  showCall(key);
  Sound.play(key === '윷' || key === '모' ? 'hot' : key === '빽도' ? 'back' : 'land');
  await sleep(reduceMotion ? 200 : fast ? 330 : 520);
}
const toastEl = $('toast'); let toastTimer = null;
function toast(msg, ms){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms || 2000); }
function setStatus(t){ $('status').textContent = t; }

// ---------- 공통 진행 ----------
let mode = null;         // 'solo' | 'multi' | null
let mySeat = 0, busy = false, animating = false, token = 0, lastSeq = 0, winSoundGid = null;
let run = null;          // 혼자 원정 기록
function nameOf(seat){
  if (mode === 'solo') return seat === 0 ? '나' : STAGES[run.stage].name;
  if (mode === 'multi' && NET.state && NET.state.players[seat]) return NET.state.players[seat].name;
  return '상대';
}
function canAct(){ return !!(G && mode && !busy && !animating && G.winner === null && G.turn === mySeat && phaseOf() === 'move' && !modalBlocks()); }
function canThrow(){ return !!(G && mode && !busy && !animating && G.winner === null && G.turn === mySeat && phaseOf() === 'throw' && !modalBlocks()); }
function modalBlocks(){ return !modal.hidden && modalKind !== 'rules'; }

async function animateEvent(ev, tk){
  // 친구 화면에서 온 동작은 조금 빠르게 보여줘서 밀리지 않게 해요.
  const fast = mode === 'multi' && ev.seat !== mySeat;
  if (ev.t === 'throw'){
    if (ev.seat !== mySeat) setStatus(josa(nameOf(ev.seat), '이', '가') + (ev.reroll ? ' 다시 던져요.' : ' 던지는 중이에요.'));
    await animThrow(ev.key, fast);
    if (ev.extra) setStatus(ev.seat === mySeat ? ev.key + '! 한 번 더 던지세요.' : nameOf(ev.seat) + ': ' + ev.key + '! 한 번 더 던져요.');
    return;
  }
  if (ev.t === 'move'){
    const stepMs = reduceMotion ? 50 : fast ? 110 : 150;
    if (ev.from === WAIT){ ev.ids.forEach(id => disp[id] = 0); renderDisp(true); await sleep(40); }
    for (const n of ev.vis){ ev.ids.forEach(id => disp[id] = n); renderDisp(); Sound.play('step'); await sleep(stepMs); if (tk !== token) return; }
    if (ev.end === HOME) ev.ids.forEach(id => disp[id] = HOME);
    else if (ev.end === WAIT) ev.ids.forEach(id => disp[id] = WAIT);
    if (ev.victims.length){
      ev.victims.forEach(id => disp[id] = WAIT); flashNode(ev.end);
      Sound.play('capture');
      if (ev.seat !== mySeat && ev.victims.some(id => seatOfId(id) === mySeat)) setTimeout(() => Sound.play('ouch'), 420);
    }
    if (ev.trapped){ for (const id in disp) if (seatOfId(id) === ev.seat && disp[id] === ev.end) disp[id] = WAIT; flashNode(ev.end); Sound.play('back'); }
    if (ev.home) Sound.play('goal');
    renderDisp();
    eventToast(ev);
    return;
  }
  if (ev.t === 'skip'){ toast(ev.keys.join('·') + ': 움직일 말이 없어서 넘어가요.'); await sleep(reduceMotion ? 80 : 350); return; }
  if (ev.t === 'turn'){
    if (ev.skipped) toast('방장이 차례를 넘겼어요.');
    else if (ev.bonus) toast((ev.seat === mySeat ? '설욕! 이번 차례에 ' : nameOf(ev.seat) + ' 설욕: ') + ev.bonus + '번 더 던져요.');
    await sleep(reduceMotion ? 60 : 220); return;
  }
  if (ev.t === 'augment'){
    toast('증강 라운드 ' + ev.round + '! 모두 부적을 하나씩 더 골라요.', 2600);
    Sound.play('augment');
    await sleep(reduceMotion ? 80 : 600); return;
  }
  if (ev.t === 'augdone'){
    toast(ev.picks.map((id, s) => (s === mySeat ? '나' : nameOf(s)) + ': ' + (UPG[id] ? UPG[id].name : '-')).join(' · '), 3600);
    await sleep(reduceMotion ? 80 : 400);
  }
}
function eventToast(ev){
  const mine = ev.seat === mySeat;
  if (ev.trapped){ toast(mine ? '함정에 걸렸어요! 출발점으로 돌아가요.' : '함정에 걸렸어요! ' + nameOf(ev.seat) + ' 말이 출발점으로 돌아가요.'); return; }
  if (ev.victims.length){
    const hitMe = ev.victims.some(id => seatOfId(id) === mySeat);
    if (mine) toast(ev.chain ? '잡았다! 잡기 연쇄 발동, 2번 더 던져요.' : '잡았다! 한 번 더 던져요.');
    else if (hitMe) toast(josa(nameOf(ev.seat), '이', '가') + ' 내 말을 잡았어요.');
    else toast(josa(nameOf(ev.seat), '이', '가') + ' ' + nameOf(seatOfId(ev.victims[0])) + ' 말을 잡았어요.');
    return;
  }
  if (ev.home) toast(mine ? (ev.home > 1 ? '업힌 말 ' + ev.home + '개가 함께 골인!' : '골인!') : nameOf(ev.seat) + ' 말 ' + ev.home + '개 골인');
}
async function playNewEvents(tk){
  animating = true; updateUI();
  for (const e of G.events.filter(e => e.seq > lastSeq)){
    await animateEvent(e, tk);
    if (tk !== token){ animating = false; return false; }
    lastSeq = e.seq;
  }
  animating = false;
  syncDisp(); renderTraps();
  return true;
}
// 내 차례에 한 동작(던지기, 다시 던지기, 이동)을 하고 화면에 보여줘요.
async function runLocal(fn){
  if (busy || animating || !G || G.turn !== mySeat || G.winner !== null) return;
  busy = true; clearPreview(); sel = -1;
  const seat = G.turn;
  const ev = fn();
  if (!ev){ busy = false; updateUI(); return; }
  if (mode === 'solo' && ev.t === 'move' && ev.victims.length){ run.score += 40*ev.victims.length; run.captures += ev.victims.length; }
  settle(seat);
  if (mode === 'multi') pushGame();
  const tk = token;
  const ok = await playNewEvents(tk);
  if (!ok || tk !== token) return;
  busy = false;
  afterChange();
}
function afterChange(){
  if (!G) { updateUI(); return; }
  if (G.winner !== null){ updateUI(); onWinner(); return; }
  if (G.augment){
    setStatus('증강 라운드 ' + G.augment.round + ': 모두 부적을 고르는 중이에요.');
    updateUI();
    if (mode === 'multi') showAugment();
    return;
  }
  if (modalKind === 'augment' || modalKind === 'augwait') closeModal();
  if (G.turn === mySeat){
    const ph = phaseOf();
    if (ph === 'move'){ sel = 0; autoPreview(); setStatus(G.chips.length > 1 ? '쓸 결과를 고르고, 움직일 말을 누르세요.' : '움직일 말을 누르세요. 한 번 더 누르면 이동해요.'); }
    else setStatus(G.chips.length ? '한 번 더 던지세요.' : '윷을 던질 차례예요.');
  } else {
    setStatus(josa(nameOf(G.turn), '이', '가') + ' 할 차례예요.');
    if (mode === 'solo') aiTurn();
  }
  updateUI();
}
function autoPreview(){
  if (sel < 0 || !G.chips[sel]) return;
  const key = G.chips[sel].key, froms = legalFroms(mySeat, key);
  if (froms.length === 1){ const sim = simulate(mySeat, key, froms[0], quickAlt); preview = { from:froms[0], sim }; drawPreview(mySeat, sim, froms[0]); }
}
let quickAlt = false;   // 날쌘 도: 2칸으로 갈지
function selectChip(i){
  if (!canAct()) return;
  const c = G.chips[i];
  if (sel === i && c && c.key === '도' && hasC(mySeat, 'quickDo')){
    // 같은 도를 한 번 더 누르면 1칸 ↔ 2칸
    quickAlt = !quickAlt;
    const from = preview ? preview.from : null;
    clearPreview();
    if (from !== null){ const sim = simulate(mySeat, '도', from, quickAlt); preview = { from, sim }; drawPreview(mySeat, sim, from); }
    else autoPreview();
    updateUI(); return;
  }
  sel = i; quickAlt = false; clearPreview(); autoPreview(); updateUI();
}
function onPick(from){
  if (!canAct() || sel < 0 || !G.chips[sel]) return;
  const key = G.chips[sel].key;
  if (!legalFroms(mySeat, key).includes(from)) return;
  if (preview && preview.from === from){ confirmMove(); return; }
  const sim = simulate(mySeat, key, from, quickAlt);
  preview = { from, sim }; drawPreview(mySeat, sim, from); updateUI();
}
function confirmMove(){ if (!canAct() || !preview || sel < 0) return; const ci = sel, from = preview.from, alt = quickAlt; quickAlt = false; runLocal(() => actMove(mySeat, ci, from, alt)); }
function doThrow(){ if (!canThrow()) return; runLocal(() => actThrow(mySeat, false)); }
function doReroll(){ if (!canAct() || sel < 0 || rerollsLeft(mySeat) <= 0) return; const ci = sel; runLocal(() => actReroll(mySeat, ci)); }
function onWinner(){
  if (mode === 'solo'){
    if (run.ending) return; run.ending = true;
    Sound.play(G.winner === 0 ? 'win' : 'lose');
    const tk = token;
    setTimeout(() => { if (tk === token) stageEnd(G.winner === 0); }, 700);
  } else if (mode === 'multi'){
    setStatus(G.winner === mySeat ? '내가 이겼어요!' : josa(nameOf(G.winner), '이', '가') + ' 이겼어요.');
    if (winSoundGid !== G.gid){ winSoundGid = G.gid; Sound.play(G.winner === mySeat ? 'win' : 'lose'); }
    if (NET.state && NET.state.phase === 'over') showOver();
  }
}

const mainBtn = $('mainBtn'), rerollBtn = $('rerollBtn'), enterBtn = $('enterBtn'), chipsEl = $('chips'), skipBtn = $('skipBtn');
function stepLabel(seat, key, selected){
  if (key === '빽도') return '1칸 뒤로';
  if (key === '도' && hasC(seat, 'quickDo')) return (selected && quickAlt ? '2칸' : '1칸') + ' · ' + (selected ? '누르면 ' + (quickAlt ? '1칸' : '2칸') : '1~2칸');
  return STEP[key] + '칸' + ((key === '윷' || key === '모') ? ' · 한 번 더' : '');
}
function updateUI(){
  // 위쪽: 혼자 원정이면 일곱 판 길, 친구와 하기면 방 코드
  const road = $('road');
  road.hidden = mode === 'multi';
  $('roomBadge').hidden = mode !== 'multi';
  if (mode === 'multi' && NET.code) $('roomBadgeCode').textContent = NET.code;
  road.textContent = '';
  STAGES.forEach((s, i) => {
    const li = document.createElement('li');
    if (mode === 'solo' && run){ if (i < run.stage) li.className = 'done'; else if (i === run.stage) li.className = 'now'; }
    const d = document.createElement('span'); d.className = 'dot'; li.appendChild(d);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name; li.appendChild(nm);
    li.title = (i + 1) + '판 ' + s.name;
    road.appendChild(li);
  });
  $('tagline').textContent = mode === 'multi' ? '친구들과 윷판 한 판, 부적 하나씩 들고' : '윷놀이 일곱 판, 부적을 모으며 끝까지';

  renderSeats();

  // 내 자리
  const meTok = $('meTok'); meTok.className = 'tok s' + mySeat;
  $('meName').textContent = mode === 'multi' && NET.state && NET.state.players[mySeat] ? NET.state.players[mySeat].name + ' (나)' : '나';
  $('mePieces').textContent = G ? pcs(mySeat).length : 3;
  $('meHome').textContent = G ? pcs(mySeat).filter(p => p.node === HOME).length : 0;
  $('meWait').textContent = G ? waitingOf(mySeat).length : 3;

  // 버튼
  const ph = phaseOf();
  const myTurn = G && G.turn === mySeat && G.winner === null;
  if (!G){ mainBtn.disabled = true; mainBtn.textContent = '윷 던지기'; }
  else if (G.winner !== null){ mainBtn.disabled = true; mainBtn.textContent = '판이 끝났어요'; }
  else if (G.augment){ mainBtn.disabled = true; mainBtn.textContent = '증강 고르는 중'; }
  else if (!myTurn){ mainBtn.disabled = true; mainBtn.textContent = nameOf(G.turn) + ' 차례'; }
  else if (ph === 'throw'){ mainBtn.disabled = !canThrow(); mainBtn.textContent = G.chips.length ? '한 번 더 던지기' : '윷 던지기'; }
  else { mainBtn.disabled = !(canAct() && preview); mainBtn.textContent = preview ? '여기로 이동' : '움직일 말을 고르세요'; }

  const myRerolls = G ? 2*cnt(mySeat, 'reroll') : 0;
  rerollBtn.hidden = !(G && myRerolls > 0);
  $('rerollN').textContent = G ? rerollsLeft(mySeat) : 0;
  rerollBtn.disabled = !(canAct() && sel >= 0 && rerollsLeft(mySeat) > 0);

  const isHost = mode === 'multi' && NET.state && NET.seat === 0;
  skipBtn.hidden = !(isHost && NET.state.phase === 'play' && G && G.winner === null && !G.augment && G.turn !== mySeat);
  if (skipBtn.hidden) resetSkipConfirm();

  // 결과 칩
  chipsEl.textContent = '';
  if (G && G.winner === null){
    if (!G.chips.length){ const s = document.createElement('span'); s.className = 'none'; s.textContent = myTurn ? '던진 결과가 여기에 쌓여요.' : ''; chipsEl.appendChild(s); }
    G.chips.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'chip' + ((c.key === '윷' || c.key === '모') ? ' hot' : c.key === '빽도' ? ' back' : '') + (G.turn !== mySeat ? ' theirs' : '');
      const bb = document.createElement('b'); bb.textContent = c.key; b.appendChild(bb);
      const sm = document.createElement('small'); sm.textContent = stepLabel(G.turn, c.key, G.turn === mySeat && i === sel); b.appendChild(sm);
      b.setAttribute('aria-pressed', String(G.turn === mySeat && i === sel));
      b.disabled = !canAct();
      b.addEventListener('click', () => selectChip(i));
      chipsEl.appendChild(b);

  }

  // 움직일 수 있는 말
  for (const id in pieceEls) pieceEls[id].classList.remove('movable', 'selected');
  enterBtn.classList.remove('movable', 'selected');
  enterBtn.disabled = true;
  if (canAct() && sel >= 0 && G.chips[sel]){
    const key = G.chips[sel].key;
    for (const from of legalFroms(mySeat, key)){
      if (from === WAIT){ enterBtn.disabled = false; enterBtn.classList.add(preview && preview.from === WAIT ? 'selected' : 'movable'); continue; }
      for (const p of atN(mySeat, from)) pieceEls[p.id].classList.add(preview && preview.from === from ? 'selected' : 'movable');
    }
  }
  renderCharms();
  renderRoomPanel();
}

// ---------- 혼자 원정 ----------
let aiRunning = false;
async function aiTurn(){
  if (aiRunning || mode !== 'solo') return;
  aiRunning = true;
  const tk = token, seat = 1, st = STAGES[run.stage];
  await sleep(reduceMotion ? 150 : 520);
  while (tk === token && G && G.winner === null && G.turn === seat){
    const ph = phaseOf();
    if (ph === 'throw'){
      const ev = actThrow(seat, false);
      if (!(await playNewEvents(tk))) break;
      if ((ev.key === '빽도' || ev.key === '도') && rerollsLeft(seat) > 0){
        actReroll(seat, G.chips.length - 1);
        if (!(await playNewEvents(tk))) break;
      }
      settle(seat);
      if (!(await playNewEvents(tk))) break;
    } else if (ph === 'move'){
      const best = aiChoose(seat, st.noise, st.capW, Math.random);
      if (!best){ G.chips = []; settle(seat); if (!(await playNewEvents(tk))) break; continue; }
      const key = G.chips[best.ci].key;
      drawPreview(seat, simulate(seat, key, best.from, best.alt), best.from);
      await sleep(reduceMotion ? 150 : 520);
      if (tk !== token) break;
      clearPreview();
      const ev = actMove(seat, best.ci, best.from, best.alt);
      if (ev && ev.trapped) run.score += 60;
      settle(seat);
      if (!(await playNewEvents(tk))) break;
    } else break;
    updateUI();
  }
  aiRunning = false;
  if (tk === token && G) afterChange();
}
const MY_PIECES = [3, 3, 3, 4, 4, 5, 5];
function startSolo(){

  if (s.phase === 'play' && G && G.augment) return direct ? 3000 : 1200;

let remoteQueue = [], remoteRunning = false;
// st: 서버가 확인한 방 상태. force: 내가 방금 서버에 요청해서 받은 응답. fix: 다른 사람이 "서버 기준으로 다시 맞추라"고 보낸 상태.
async function onServerState(st, force, fix){
  if (!st) return;
  if (!force && (fix ? st.v < NET.v : st.v <= NET.v)) return;
  // 내 동작을 서버로 보내는 중이거나 화면에 보여주는 중이면, 그 사이에 받은 상태는 다음 확인 때 다시 받아요.
  if (!force && (st.phase === 'play' || st.phase === 'over') && (NET.inflight || NET.dirty || busy)) return;
  NET.state = st; NET.v = st.v;
  const seat = st.players.findIndex(p => p.pid === NET.pid);
  if (seat < 0){ leaveRoom(true); mode = null; G = null; buildPieces(); updateUI(); showFriends('', '방에서 나가졌어요.'); return; }
  NET.seat = seat; mySeat = seat;
  p2pSync();
  CH = s => (G && G.charms && G.charms[s]) || {};
  if (st.phase === 'lobby'){
    if (G){ G = null; token++; buildPieces(); clearPreview(); }
    setStatus('친구들이 모이길 기다리는 중이에요.');
    showLobby(); return;
  }
  if (st.phase === 'charm'){
    if (G){ G = null; token++; buildPieces(); clearPreview(); }
    setStatus('부적을 고르는 중이에요.');
    const me = st.players[seat];
    if (!me.charm) { if (modalKind !== 'charm') showCharmPick(); }
    else showCharmWait();
    return;
  }
  // play 또는 over
  if (!st.game) return;
  if (!G || G.gid !== st.game.gid){ NET.behindSince = 0; loadGame(st.game); }
  else if (st.game.seq > G.seq){ NET.behindSince = 0; await applyRemote(st.game); }
  else if (st.game.seq === G.seq){
    NET.behindSince = 0;
    if (st.game.rev && G.rev && st.game.rev !== G.rev) loadGame(st.game);   // 순번은 같은데 내용이 다르면 서버 기준으로 맞춰요
  } else {
    // 서버가 내 화면보다 뒤처져 있어요. 바로 연결로 먼저 받은 내용이 아직 서버에 도착하지 않은 경우라 잠깐 기다려요.
    if (force || fix) loadGame(st.game);
    else if (!NET.behindSince) NET.behindSince = Date.now();
    else if (Date.now() - NET.behindSince > 6000){ NET.behindSince = 0; loadGame(st.game); }
  }

}
function loadGame(game){
  token++; busy = false; animating = false; remoteQueue = []; remoteRunning = false;

  if (modalKind === 'lobby' || modalKind === 'charm' || modalKind === 'charmwait' || modalKind === 'over') closeModal();
  toast(G.turn === mySeat ? '내가 먼저 던져요.' : josa(nameOf(G.turn), '이', '가') + ' 먼저 던져요.', 2200);
}
async function applyRemote(game){
  NET.seenSeq = Math.max(NET.seenSeq || 0, game.seq);
  remoteQueue.push(game);
  if (remoteRunning) return;
  remoteRunning = true;
  while (remoteQueue.length){
    const snap = remoteQueue.shift(); const tk = token;
    animating = true; clearPreview(); sel = -1; updateUI();
    const evs = (snap.events || []).filter(e => e.seq > lastSeq);
    for (const e of evs){ await animateEvent(e, tk); if (tk !== token) break; lastSeq = e.seq; }
    animating = false;
    if (tk !== token) break;
    G = snap; lastSeq = G.seq; NET.syncedSeq = G.seq;
    syncDisp(); renderTraps();
  }
  remoteRunning = false;
  afterChange();
}
function pushGame(){ NET.dirty = true; if (!NET.inflight) flush(); }
async function flush(){
  NET.inflight = true;
  let behindTries = 0;
  while (NET.dirty && NET.code && G){
    NET.dirty = false;
    const snap = JSON.parse(JSON.stringify(G));
    p2pSend({ type:'game', game:snap });   // 바로 연결된 친구들에게는 서버 확인을 기다리지 않고 먼저 보내요
    try {
      const d = await api('POST', { action:'update', code:NET.code, pid:NET.pid, token:NET.token, baseSeq:NET.syncedSeq, game:snap });
      NET.syncedSeq = snap.seq; behindTries = 0;
      if (d.state){ NET.state = d.state; NET.v = d.state.v; p2pSend({ type:'state', state:d.state }); }
    } catch(e){
      const sg = e.data && e.data.state && e.data.state.game;
      if (e.status === 409 && sg && G && sg.gid === G.gid && sg.seq < NET.syncedSeq && behindTries < 15){
        // 앞사람이 보낸 내용이 아직 서버에 도착하지 않았어요. 잠깐 기다렸다가 다시 보내요.
        behindTries++; NET.dirty = true; await sleep(300); continue;
      }
      if (e.status === 409 && e.data && e.data.state){
        NET.inflight = false; NET.dirty = false;
        toast('다른 친구 화면과 진행을 다시 맞췄어요.');
        p2pSend({ type:'fix', state:e.data.state });
        G = null; await onServerState(e.data.state, true);
        return;
      }
      if (e.status === 404 || e.status === 403){ NET.inflight = false; leaveRoom(true); mode = null; G = null; buildPieces(); updateUI(); showFriends('', e.message); return; }
      NET.dirty = true; toast('연결이 불안정해요. 다시 보내는 중이에요.'); await sleep(1500);
    }
  }
  NET.inflight = false;
  if (NET.state && NET.state.phase === 'over' && G && G.winner !== null) showOver();
}
// 방 서버에 요청하고, 받은 상태를 바로 연결된 친구들에게도 전해요.
// 서버가 아직 내 화면보다 뒤처져 있으면(바로 연결로 먼저 받은 경우) 잠깐 기다렸다가 다시 보내요.
async function roomCall(action, extra){
  for (let i = 0; ; i++){
    try {
      const d = await api('POST', Object.assign({ action, code:NET.code, pid:NET.pid, token:NET.token }, extra || {}));
      if (d.state){ p2pSend({ type:'state', state:d.state }); await onServerState(d.state, true); }
      return d;
    } catch(e){
      const sg = e.data && e.data.state && e.data.state.game;
      if (e.status === 409 && sg && G && sg.gid === G.gid && sg.seq < G.seq && i < 12){ await sleep(350); continue; }
      throw e;
    }
  }
}
async function hostAction(action, extra){
  try { await roomCall(action, extra); return true; }
  catch(e){ toast(e.message, 2600); if (e.data && e.data.state) await onServerState(e.data.state, true); return false; }
}

// ---------- 브라우저끼리 바로 연결 (빠른 전달) ----------
// 서버가 계속 기준이 되고, 바로 연결은 바뀐 내용을 더 빨리 알려주는 지름길이에요.
// 연결이 안 되는 환경이면 서버 확인만으로 게임이 그대로 돌아가요.
const P2P = { peer:null, id:null, conns:{}, ready:false, pending:{}, tries:0, failed:false };
function p2pStart(){
  if (P2P.peer || !NET.code) return;
  if (typeof window.Peer !== 'function'){ if (P2P.tries++ < 10) setTimeout(p2pStart, 1000); else { P2P.failed = true; renderRoomPanel(); } return; }
  const id = 'yutgil-' + NET.code + '-' + Math.random().toString(36).slice(2, 10);
  let peer;
  try { peer = new window.Peer(id, Object.assign({ debug:0 }, window.YUTGIL_PEER || {})); } catch(e){ P2P.failed = true; return; }
  P2P.peer = peer; P2P.id = id; P2P.failed = false;
  peer.on('open', () => {
    P2P.ready = true; renderRoomPanel();
    api('POST', { action:'peer', code:NET.code, pid:NET.pid, token:NET.token, peer:id })
      .then(d => { if (d.state){ p2pSend({ type:'state', state:d.state }); onServerState(d.state, false); } })
      .catch(() => {});
    p2pSync();
  });
  peer.on('connection', c => p2pAttach(c, c.metadata && c.metadata.pid));   // 상대가 걸어온 연결: 상대가 보낸 자기 pid
  peer.on('disconnected', () => { setTimeout(() => { try { if (P2P.peer === peer && !peer.destroyed) peer.reconnect(); } catch(e){} }, 1500); });
  peer.on('error', () => { renderRoomPanel(); });
}
function p2pStop(){
  for (const k in P2P.conns){ try { P2P.conns[k].close(); } catch(e){} }
  P2P.conns = {}; P2P.pending = {}; P2P.ready = false; P2P.tries = 0;
  if (P2P.peer){ try { P2P.peer.destroy(); } catch(e){} }
  P2P.peer = null; P2P.id = null;
}
function p2pAttach(c, pid){
  if (typeof pid !== 'string'){ try { c.close(); } catch(e){} return; }
  c.on('open', () => {
    const old = P2P.conns[pid];
    if (old && old !== c){ try { old.close(); } catch(e){} }
    P2P.conns[pid] = c; delete P2P.pending[c.peer];
    renderRoomPanel();
    if (NET.state) c.send({ type:'state', state:NET.state });
  });
  c.on('data', msg => onPeerMsg(msg));
  c.on('close', () => { if (P2P.conns[pid] === c) delete P2P.conns[pid]; renderRoomPanel(); });
  c.on('error', () => {});
}
function p2pSync(){
  if (!P2P.ready || !P2P.peer || !NET.state) return;
  for (const p of NET.state.players){
    if (p.pid === NET.pid || !p.peer) continue;
    const c = P2P.conns[p.pid];
    if (c && c.open && c.peer === p.peer) continue;
    if (NET.pid > p.pid) continue;   // 두 사람 중 한쪽만 연결을 시작해요
    if (P2P.pending[p.peer]) continue;
    P2P.pending[p.peer] = true;
    try { p2pAttach(P2P.peer.connect(p.peer, { reliable:true, serialization:'json', metadata:{ pid:NET.pid } }), p.pid); } catch(e){}   // 내가 건 연결: 상대 pid로 기억해요
    const target = p.peer;
    setTimeout(() => { delete P2P.pending[target]; }, 8000);
  }
}
function p2pConnectedCount(){ let n = 0; for (const k in P2P.conns) if (P2P.conns[k].open) n++; return n; }
function p2pAllConnected(){ return !!(NET.state && NET.state.players.length > 1 && p2pConnectedCount() >= NET.state.players.length - 1); }
function p2pSend(msg){ for (const k in P2P.conns){ const c = P2P.conns[k]; if (c.open){ try { c.send(msg); } catch(e){} } } }
function onPeerMsg(msg){
  if (!msg || typeof msg !== 'object' || mode !== 'multi') return;
  if ((msg.type === 'state' || msg.type === 'fix') && msg.state && msg.state.code === NET.code){ onServerState(msg.state, false, msg.type === 'fix'); return; }
  if (msg.type === 'game' && msg.game && G && msg.game.gid === G.gid && NET.state && NET.state.phase === 'play'){
    if (NET.inflight || NET.dirty || busy) return;
    if (msg.game.seq > G.seq) applyRemote(msg.game);
  }
}

function showLobby(){
  const st = NET.state; if (!st) return;
  if (modalKind !== 'lobby'){
    openModal('lobby',
      '<p class="eyebrow">친구와 하기 · 대기실</p><p class="roomcode" id="lbCode"></p>' +
      '<p class="lead">친구에게 방 코드나 아래 링크를 보내 주세요. 2~4명이 함께할 수 있어요.</p>' +
      '<div class="share"><input id="lbLink" readonly aria-label="초대 링크"><button class="btn ghost small" id="lbCopy" type="button">링크 복사</button></div>' +

      '<p class="fine" id="lbNote"></p>' +

        $('lbCharms').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || NET.seat !== 0) return; hostAction('settings', { settings:{ pieces:NET.state.settings.pieces, charms:b.dataset.v === '1' } }); });
        $('lbStart').addEventListener('click', async () => { $('lbStart').disabled = true; await hostAction('start'); if ($('lbStart')) $('lbStart').disabled = false; });
        $('lbLeave').addEventListener('click', () => leaveRoom(false));
      });
  }

  $('lbCode').textContent = st.code;
  $('lbLink').value = inviteLink(st.code);
  const ul = $('lbPlayers'); ul.textContent = '';
  st.players.forEach((p, s) => {
    const li = document.createElement('li');
    const t = document.createElement('span'); t.className = 'tok s' + s; t.setAttribute('aria-hidden', 'true');
    const nm = document.createElement('span'); nm.textContent = p.name;
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = [s === 0 ? '방장' : '', s === NET.seat ? '나' : ''].filter(Boolean).join(' · ');
    li.appendChild(t); li.appendChild(nm); li.appendChild(tag); ul.appendChild(li);
  });
  $('lbPieces').querySelectorAll('button').forEach(b => { b.setAttribute('aria-pressed', String(Number(b.dataset.v) === st.settings.pieces)); b.disabled = !isHost; });
  $('lbCharms').querySelectorAll('button').forEach(b => { b.setAttribute('aria-pressed', String((b.dataset.v === '1') === !!st.settings.charms)); b.disabled = !isHost; });
  $('lbStart').hidden = !isHost;
  $('lbStart').disabled = st.players.length < 2;
  $('lbNote').textContent = isHost ? (st.players.length < 2 ? '한 명 이상 더 들어오면 시작할 수 있어요.' : st.players.length + '명이 모였어요. 준비되면 시작하세요.') : '방장이 시작하길 기다리는 중이에요.';
}
function showCharmPick(){
  const st = NET.state, offers = (st.offers && st.offers[NET.seat]) || [];
  openModal('charm', '<p class="eyebrow">친구와 하기</p><h2>이번 판에 가져갈 부적</h2><p class="lead">하나를 고르세요. 다른 사람이 뭘 골랐는지는 시작하면 보여요.</p><div class="offers" id="offers"></div><p class="err" id="cErr"></p>', s => {
    fillOffers(s.querySelector('#offers'), offers, async id => {
      try { await roomCall('charm', { charm:id }); }
      catch(e){ $('cErr').textContent = e.message; s.querySelectorAll('.offer').forEach(x => x.disabled = false); }
    });
  });
}
function showCharmWait(){
  const st = NET.state;
  if (modalKind !== 'charmwait') openModal('charmwait', '<p class="eyebrow">친구와 하기</p><h2>다른 사람들이 고르는 중이에요</h2><ul class="plist" id="cwList"></ul>', null);
  const ul = $('cwList'); ul.textContent = '';
  st.players.forEach((p, s) => {
    const li = document.createElement('li');
    const t = document.createElement('span'); t.className = 'tok s' + s; t.setAttribute('aria-hidden', 'true');
    const nm = document.createElement('span'); nm.textContent = p.name + (s === NET.seat ? ' (나)' : '');
    const ok = document.createElement('span'); ok.className = 'ok' + (p.charm ? ' done' : ''); ok.textContent = p.charm ? '골랐어요' : '고르는 중';
    li.appendChild(t); li.appendChild(nm); li.appendChild(ok); ul.appendChild(li);
  });
}
let augShown = 0;   // 지금 띄워 둔 증강 라운드 번호 (같은 창을 다시 그리지 않으려고)
function showAugment(){
  const a = G && G.augment; if (!a) return;
  const under = a.under.includes(mySeat);
  if (!a.picks[mySeat]){
    if (modalKind === 'augment' && augShown === a.round) return;
    augShown = a.round;
    openModal('augment', '<p class="eyebrow"></p><h2></h2><p class="lead"></p><div class="offers" id="offers"></div><p class="err" id="aErr"></p>', s => {
      s.querySelector('.eyebrow').textContent = '증강 라운드 ' + a.round + (under ? ' · 역전 후보' : '');
      s.querySelector('h2').textContent = under ? '역전 부적 하나를 고르세요' : '부적 하나를 더 고르세요';
      s.querySelector('.lead').textContent = (a.round === 1 ? '첫 골인이 나왔어요. ' : '골인을 하나 남긴 사람이 나왔어요. ') +
        (under ? '지금 가장 뒤처져 있어서 더 센 부적이 나왔어요.' : '고른 부적은 이번 판이 끝날 때까지 가져가요.');
      fillOffers(s.querySelector('#offers'), a.offers[mySeat], async id => {
        try { await roomCall('augment', { charm:id }); }
        catch(e){ if ($('aErr')) $('aErr').textContent = e.message; s.querySelectorAll('.offer').forEach(x => x.disabled = false); }
      }, id => cnt(mySeat, id));
    });
    return;
  }
  if (modalKind !== 'augwait'){
    openModal('augwait', '<p class="eyebrow" id="awRound"></p><h2>다른 사람들이 고르는 중이에요</h2><ul class="plist" id="awList"></ul>' +
      '<button class="btn ghost small" id="awForce" type="button" hidden>기다리지 않고 남은 사람은 무작위로 정하기</button>', () => {
      $('awForce').addEventListener('click', async () => { $('awForce').disabled = true; await hostAction('skip'); if ($('awForce')) $('awForce').disabled = false; });
    });
  }
  $('awRound').textContent = '증강 라운드 ' + a.round;
  const ul = $('awList'); ul.textContent = '';
  for (let s = 0; s < G.n; s++){
    const li = document.createElement('li');
    const t = document.createElement('span'); t.className = 'tok s' + s; t.setAttribute('aria-hidden', 'true');
    const nm = document.createElement('span'); nm.textContent = nameOf(s) + (s === mySeat ? ' (나)' : '');
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = a.under.includes(s) ? '역전 후보' : '';
    const ok = document.createElement('span'); ok.className = 'ok' + (a.picks[s] ? ' done' : ''); ok.textContent = a.picks[s] ? '골랐어요' : '고르는 중';
    li.appendChild(t); li.appendChild(nm); li.appendChild(tag); li.appendChild(ok); ul.appendChild(li);
  }
  $('awForce').hidden = !(NET.seat === 0 && a.picks.some(p => !p));
}
function showOver(){
  if (!G || G.winner === null) return;
  const isHost = NET.seat === 0, w = G.winner;
  openModal('over',
    '<p class="eyebrow">판이 끝났어요</p><h2></h2><p class="lead" id="ovLead"></p>' +
    '<div class="actions"><button class="btn primary" id="ovAgain" type="button">한 판 더</button><button class="btn ghost small" id="ovView" type="button">윷판 보기</button><button class="btn ghost small" id="ovLeave" type="button">방 나가기</button></div><p class="fine" id="ovNote"></p>',
    s => {
      s.querySelector('h2').textContent = w === mySeat ? '내가 이겼어요!' : josa(nameOf(w), '이', '가') + ' 이겼어요';
      const parts = [];
      for (let i = 0; i < G.n; i++) parts.push(nameOf(i) + ' 골인 ' + pcs(i).filter(p => p.node === HOME).length + '/' + pcs(i).length);
      $('ovLead').textContent = parts.join(' · ');
      $('ovAgain').hidden = !isHost;
      $('ovNote').textContent = isHost ? '한 판 더를 누르면 모두 대기실로 돌아가요.' : '방장이 한 판 더를 누르면 대기실로 돌아가요.';
      $('ovAgain').addEventListener('click', () => hostAction('reset'));
      $('ovView').addEventListener('click', closeModal);
      $('ovLeave').addEventListener('click', () => leaveRoom(false));
    });
}
function renderRoomPanel(){
  const panel = $('roomPanel');
  panel.hidden = mode !== 'multi' || !NET.code;
  if (panel.hidden) return;
  $('rpCode').textContent = NET.code;
  const link = inviteLink(NET.code);
  if ($('rpLink').value !== link) $('rpLink').value = link;
  const others = NET.state ? NET.state.players.length - 1 : 0, n = p2pConnectedCount();
  let text, st;
  if (others <= 0){ text = '친구가 들어오면 바로 연결을 시도해요.'; st = 'wait'; }
  else if (n >= others){ text = '실시간 연결됨 · ' + others + '명과 바로 주고받아요.'; st = 'ok'; }
  else if (P2P.failed || !P2P.peer){ text = '서버를 거쳐 주고받아요. 조금 늦게 보일 수 있어요.'; st = 'slow'; }
  else { text = '실시간 연결 ' + n + '/' + others + '명 · 나머지는 서버를 거쳐요.'; st = n ? 'part' : 'slow'; }
  $('rpNetText').textContent = text;
  $('rpDot').className = 'netdot ' + st;
}
async function copyText(input, btn){
  const text = input.value;
  try { await navigator.clipboard.writeText(text); btn.textContent = '복사했어요'; }
  catch(e){ input.focus(); input.select(); btn.textContent = '선택했어요. 복사해 주세요'; }
  setTimeout(() => { btn.textContent = '링크 복사'; }, 1800);
}
$('rpCopy').addEventListener('click', () => copyText($('rpLink'), $('rpCopy')));
$('rpLeave').addEventListener('click', () => leaveRoom(false));
let skipArmed = false, skipTimer = null;
function resetSkipConfirm(){ skipArmed = false; clearTimeout(skipTimer); skipBtn.textContent = '이 차례 넘기기'; skipBtn.classList.remove('warn'); }
skipBtn.addEventListener('click', async () => {
  if (!skipArmed){ skipArmed = true; skipBtn.textContent = '한 번 더 누르면 넘겨요'; skipBtn.classList.add('warn'); skipTimer = setTimeout(resetSkipConfirm, 3000); return; }
  resetSkipConfirm(); skipBtn.disabled = true;
  await hostAction('skip');
  skipBtn.disabled = false;
});

// 연결 상태 확인용 (브라우저 개발자 도구에서 yutgilInfo()로 볼 수 있어요)
window.yutgilInfo = () => ({ mode, seq:G ? G.seq : -1, seen:Math.max(G ? G.seq : -1, (G && NET.seenSeq) || -1), turn:G ? G.turn : -1, directPeers:p2pConnectedCount(), roomVersion:NET.v });

// ---------- 시작 ----------
updateUI();
showHome();
(async () => {
  NET.api = await probeApi(); NET.probed = true;
  if (modalKind === 'home') showHome();
  if (!NET.api) return;
  const urlCode = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  let sess = null; try { sess = JSON.parse(lsGet('yutgil.session') || 'null'); } catch(e){}
  if (sess && sess.code && (!urlCode || urlCode === sess.code)){
    try { await rejoin(sess); return; } catch(e){ lsDel('yutgil.session'); }
  }
  if (urlCode) showFriends(urlCode);
})();
})();
